training:
  batch_size: 256
  n_epochs: 200 
  n_iters: 1000001
  snapshot_freq: 10 # 10
  snapshot_sampling: true
  clipval: 1.


test:
  begin_ckpt: 5000
  end_ckpt: 300000
  batch_size: 128

data:
  n_classes: 7
  channel: 1
  dataset: "PinWheel"
  samplesize: 10_000
  test_samplesize: 1_000
  size: 5000
  num_workers: 0
  dtype: torch.float32
  logit_transform: true
  in_sample: true

sample:
  n_gen: 5000

model:
  path: 'ot'
  nllk: true
  v: 0.4
  ngf: 800 # 120 # 100
  freqs: 2
  cnn: true

optim:
  weight_decay: 0.0001 # 0.001
  lr: 0.001 # 0.001 # try to use even smaller step size for the coupled ODE system
  multiplier: .4 # 1. larger is more concentrated?
  clip_value: 1.


flow:
  z_dim: 32 # 32 # use even number for flow model
  ngf: 800 # 120 # 100 # should be the same as model ngf, otherwise easily goes off to infinity
  sig_min: .00001
  mul: .001 # this is to decrease the impact of div estimate on the ODE solver - make it faster by scaling it down
  freqs: 2
  fix_z: true
  z_depth: 1
